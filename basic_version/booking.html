<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment | J&amp;B Family Clinic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-header">
    <a class="logo-link" href="index.html" aria-label="J&B Family Clinic Home">
      <img class="clinic-logo" src="assets/logo.png" alt="J&B Family Clinic logo">
    </a>

    <nav class="top-nav" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="service.html">Services</a></li>
        <li><a href="location.html">Location</a></li>
        <li><a class="book-now" href="booking.html">Book Now</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Banner -->
  <section class="clinic-hero clinic-hero--home" aria-label="Book an appointment">
    <div class="clinic-hero-overlay">
      <div class="clinic-hero-text">
        <p>J&amp;B FAMILY CLINIC</p>
        <h1>Ready to book?</h1>
        <span>Your health is our priority.</span>
      </div>
    </div>
  </section>

  <!-- Floating Booking Tab -->
  <a class="book-tab" href="booking.html">Book Now</a>

  <main class="container">
    <form id="bookingForm" class="booking-form">

      <h2>Book an Appointment</h2>

      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required>
      <br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <br>

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone">
      <br>

      <label for="location">Location:</label>
      <select id="location" name="location" required>
        <option value="Jurong West Street 65">Jurong West Street 65</option>
        <option value="Jurong West Street 64">Jurong West Street 64</option>
      </select>
      <br>

      <label for="date">Date:</label>
      <input type="date" id="date" name="date" required>
      <br>

      <label for="timeSlot">Time:</label>
      <select id="timeSlot" name="start" required>
        <option value="">— pick a date first —</option>
      </select>
      <br>

      <button type="submit">Confirm Booking</button>

      <p id="msg" class="form-msg"></p>
    </form>
  </main>

  <script src="booking.js"></script>
</body>
</html>
